# Limix Bot (Leox ৹ Limix AI): builds the Windows installer on a real Windows runner, checks that the packaged
# server starts, and publishes a GitHub release whose latest.yml the in-app updater reads.
# Adapted from OpenMausBot's package-win.yml (Apache-2.0). Run it from Actions → "Limix Bot Windows" → Run workflow,
# or push to main (the release tag v<version> is created by the publish step).
name: Limix Bot Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  package:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bug-report address (LIMIX_REPORT_ALIAS secret)
        shell: bash
        env:
          ALIAS: ${{ secrets.LIMIX_REPORT_ALIAS }}
        run: |
          if [[ "$ALIAS" =~ ^[A-Za-z0-9]{8,128}$ ]]; then
            printf 'export const LIMIX_REPORT_ALIAS: string = "%s";\n' "$ALIAS" > server/limix-report-config.ts
            echo "bug reports: inbox alias set"
          else
            echo "::warning::LIMIX_REPORT_ALIAS is not set: this build cannot send bug reports."
          fi
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify gateway clipboard
        run: |
          node --test electron/limix-gateway-clipboard.node-test.mjs limix/gateway/test/*.test.mjs
          node node_modules/vitest/vitest.mjs run src/components/LimixGatewayClipboard.dom.test.ts src/lib/copy-text.test.ts src/lib/copy-text.guard.test.ts
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - name: bundled Python and uv for skills (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          py=cpython-3.12.16+20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz
          py_sha=1f2ab53880fc67ea323398c6388e05af28addc99a8e389209f08a51fdff4b149
          uv_sha=a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
          rm -rf limix-runtime && mkdir -p limix-runtime/uv
          curl -fsSL -o "$RUNNER_TEMP/py.tgz" "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/${py//+/%2B}"
          echo "$py_sha  $RUNNER_TEMP/py.tgz" | sha256sum -c -
          tar --force-local -xzf "$RUNNER_TEMP/py.tgz" -C limix-runtime
          cp limix-runtime/python/python.exe limix-runtime/python/python3.exe
          curl -fsSL -o "$RUNNER_TEMP/uv.zip" "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-pc-windows-msvc.zip"
          echo "$uv_sha  $RUNNER_TEMP/uv.zip" | sha256sum -c -
          limix-runtime/python/python.exe -m zipfile -e "$(cygpath -w "$RUNNER_TEMP/uv.zip")" limix-runtime/uv
          limix-runtime/python/python.exe --version
          limix-runtime/uv/uv.exe --version
      - run: pnpm package:win

      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          for f in server/index.js server/desktop-entry.mjs ui/index.html cloudflared/cloudflared.exe app-update.yml limix-runtime/python/python.exe limix-runtime/python/python3.exe limix-runtime/uv/uv.exe skills/ui-ux-pro-max/SKILL.md skills/agent-reach/SKILL.md skills/rea-video/SKILL.md; do
            [ -f "$res/$f" ] || { echo "::error::missing $res/$f"; fail=1; }
          done
          [ -f "release/win-unpacked/Limix Bot.exe" ] || { echo "::error::missing Limix Bot.exe"; fail=1; }
          grep -Eq '^owner: leomieo$' "$res/app-update.yml" || { echo "::error::app-update.yml owner is not leomieo"; fail=1; }
          grep -Eq '^repo: limix-bot$' "$res/app-update.yml" || { echo "::error::app-update.yml repo is not limix-bot"; fail=1; }
          if grep -q "publisherName" "$res/app-update.yml"; then echo "::error::publisherName on an unsigned build"; fail=1; fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml"
          exit $fail

      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/limix-smoke" USERPROFILE="$RUNNER_TEMP/limix-smoke" \
            OMB_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      - name: stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/LimixBot-$v-setup.exe" "release/LimixBot-setup.exe"
          ls -lh release/*.exe release/*.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: limix-bot-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
