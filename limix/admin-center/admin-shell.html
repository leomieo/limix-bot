<style id="limix-admin-shell">
:root{--bg:#0d0d0f;--card:#17171b;--border:#2b2b32;--text:#f3f3f5;--muted:#a4a4af;--primary:#a99cff;--success:#56d6a0;--error:#ff7a86}
body{background:var(--bg)!important;font:14px 'Inter','Segoe UI',sans-serif;color:var(--text);margin:0}
.header{height:72px;box-sizing:border-box;padding:16px 28px!important;border-bottom:1px solid var(--border);background:var(--bg)!important;position:relative;z-index:5}
.header-logo{font-size:19px!important;font-weight:700}.header-right{gap:20px!important}.header-right a{font-size:13px}
.tabs-bar{position:fixed;left:0;top:72px;bottom:0;width:224px;box-sizing:border-box;display:flex!important;flex-direction:column;gap:7px;padding:24px 14px!important;background:var(--bg)!important;border-right:1px solid var(--border);border-bottom:0!important;z-index:4}
.tabs-bar:before{content:'QUẢN TRỊ';font-size:11px;letter-spacing:1.5px;color:var(--muted);padding:0 14px 12px}
.tab-btn{width:100%;text-align:left;border:0!important;border-radius:9px!important;padding:13px 14px!important;color:var(--muted)!important;background:transparent!important;font-weight:600;white-space:normal}
.tab-btn.active{color:var(--text)!important;background:#25232e!important}.tab-btn:hover{background:var(--card)!important;color:var(--text)!important}
.content{margin-left:224px;padding:30px 34px!important;max-width:1600px;box-sizing:border-box}.section-title{font-size:23px!important;font-weight:700;margin-bottom:24px!important}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}.btn,.btn-refresh,.lm-button{border:1px solid var(--border)!important;background:var(--card)!important;color:var(--text)!important;border-radius:9px!important;padding:9px 14px!important;font-size:13px!important;font-weight:600;line-height:1.4}
.lm-button.primary{background:#e9e6ff!important;color:#211d35!important;border-color:#e9e6ff!important}.lm-button.danger{color:#ff9ca6!important}
.lm-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.lm-heading h2{margin:0 0 8px;font-size:25px;letter-spacing:-.6px}.lm-heading p,.lm-muted{color:var(--muted);line-height:1.7;margin:0}.lm-eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted);margin-bottom:9px}
.lm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.lm-stat{border:1px solid var(--border);border-radius:13px;background:var(--card);padding:20px}.lm-stat span{display:block;color:var(--muted);font-size:12px}.lm-stat strong{display:block;font-size:28px;margin-top:9px}
.lm-toolbar{display:flex;align-items:center;gap:12px;margin:20px 0}.lm-search{width:100%;max-width:400px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px 13px;box-sizing:border-box}.lm-select{padding:10px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px}
.lm-table{width:100%;border-collapse:collapse;min-width:650px}.lm-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:14px 18px;background:#151519}.lm-table td{padding:20px 18px;border-top:1px solid var(--border);vertical-align:middle;font-size:13px}.lm-table-wrap{border:1px solid var(--border);border-radius:13px;overflow:auto;background:var(--card)}
.lm-account{font-weight:650;font-size:14px;margin-bottom:6px}.lm-code{font:11px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.lm-badge{display:inline-block;padding:5px 9px;border-radius:6px;background:#292832;color:#d5d1e7;font-size:12px;white-space:nowrap}.lm-badge.good{background:#15342a;color:#8be3ba}.lm-badge.warn{background:#392e1b;color:#e9c37c}.lm-actions{display:flex;gap:7px;flex-wrap:wrap}.lm-note{border:1px solid var(--border);border-radius:10px;padding:16px 18px;line-height:1.7;color:var(--muted);margin-top:20px;font-size:13px}.lm-note a{color:var(--primary)}
.lm-empty{text-align:center;padding:48px 18px;color:var(--muted)}.lm-form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:20px 0}.lm-field{display:flex;flex-direction:column;gap:8px}.lm-field label{font-size:12px;color:var(--muted)}.lm-field input,.lm-field select{min-width:180px;padding:10px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px}
.stat-row{gap:14px}.mini-stat{border-radius:13px!important}.table-wrap{border-radius:13px!important}.toolbar{margin-bottom:20px}#tab-cloud button{box-shadow:none}
[data-theme="light"]{--bg:#f6f6f8;--card:#fff;--border:#dedee5;--text:#20202a;--muted:#656575;--primary:#6150bc}
[data-theme="light"] .tab-btn.active{background:#e8e4fa!important}[data-theme="light"] .lm-table th{background:#eeeef3}
@media(max-width:950px){.tabs-bar{position:static;width:auto;flex-direction:row;overflow:auto;padding:12px!important;border-right:0}.tabs-bar:before{display:none}.tab-btn{width:auto;min-width:max-content}.content{margin-left:0;padding:22px!important}.lm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header{height:auto;min-height:72px}.header-right #hdr-time{display:none}}
@media(max-width:560px){.lm-heading{flex-direction:column}.lm-toolbar{flex-wrap:wrap}.header-logo{font-size:15px!important}.lm-grid{gap:9px}.lm-stat{padding:14px}.content{padding:16px!important}}
</style>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const nav=document.querySelector('.tabs-bar');
 const legacy=nav.querySelector('[onclick*="showTab(\'users\')"]');if(legacy)legacy.remove();
 const labels={customers:'Tài khoản khách hàng',structure:'Tổ chức & vai trò',plans:'Gói tài khoản',promotions:'Khuyến mại & voucher',cloud:'Máy Cloud',transactions:'Giao dịch',settings:'Cài đặt hệ thống',logs:'Nhật ký kênh'};
 for(const [key,label] of Object.entries(labels)){
  let button=nav.querySelector('[onclick*="showTab(\''+key+'\')"]');
  if(!button){button=document.createElement('button');button.className='tab-btn';button.onclick=()=>showTab(key);button.dataset.page=key;nav.append(button)}
  button.textContent=label;nav.append(button);
 }
 const brand=document.querySelector('.header-logo');if(brand)brand.textContent='Limix · Trung tâm quản trị';
 const home=document.querySelector('.header-right a[href="/"]');if(home){home.textContent='Super Admin · Leox';home.removeAttribute('href')}
 const title=document.querySelector('#tab-users .section-title');if(title)title.textContent='Tài khoản khách hàng';
 const helper=document.createElement('p');helper.className='lm-muted';helper.style.marginBottom='20px';helper.textContent='Quản lý thông tin, trạng thái, gói dịch vụ, mật khẩu và thiết bị đăng nhập của khách.';if(title)title.after(helper);
 const previous=window.showTab;
 window.showTab=function(name){
  if(!document.getElementById('tab-'+name))name='customers';previous(name);
  nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  if(name==='structure')loadStructure();if(name==='plans')loadAdminPlans();if(name==='customers')loadCustomerAdmin();if(name==='promotions')loadPromotions();
 };
 const hash=location.hash.slice(1);const saved=localStorage.getItem('admin_active_tab');
 showTab(['cloud','structure','plans','customers','promotions'].includes(hash)?hash: saved&&saved!=='logs'&&saved!=='users'?saved:'customers');
});
</script>
