<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Leox ৹ Limix AI">
<title>Limix Bot</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg:#121212; --sidebar:#0e0e0e; --card:#1b1b1b; --card-2:#202020; --hover:#2c2c2c; --control:#282828; --line:#383838; --edge:#f5f5f50f;
  --ink:#f5f5f5; --muted:#f5f5f5a8; --faint:#f5f5f591;
  --primary:#f5f5f5; --primary-ink:#121212; --wash:#f5f5f50f; --wash-2:#f5f5f514;
  --accent:#1084fe; --accent-text:#7fc0ff; --focus:#459ffe;
  --ok:#38d591; --warn:#ff9800; --bad:#ff5667;
  --shadow:0 16px 40px -16px rgb(0 0 0 / .5), 0 4px 10px -4px rgb(0 0 0 / .2);
  --font:"Geist Variable", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono:"Geist Mono Variable", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg:#fcfcfc; --sidebar:#f5f5f5; --card:#ffffff; --card-2:#efefef; --hover:#d8d8d8; --control:#e3e3e3; --line:#1c1c1c3d; --edge:#1c1c1c1f;
  --ink:#1c1c1c; --muted:#1c1c1cad; --faint:#1c1c1ca6;
  --primary:#1c1c1c; --primary-ink:#fcfcfc; --wash:#1c1c1c0f; --wash-2:#1c1c1c14;
  --accent:#126fd4; --accent-text:#0b69cc; --focus:#0b6dd3;
  --ok:#14804a; --warn:#b45309; --bad:#d6293b;
  --shadow:0 16px 40px -16px rgb(0 0 0 / .18), 0 4px 10px -4px rgb(0 0 0 / .06);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#fcfcfc; --sidebar:#f5f5f5; --card:#ffffff; --card-2:#efefef; --hover:#d8d8d8; --control:#e3e3e3; --line:#1c1c1c3d; --edge:#1c1c1c1f;
    --ink:#1c1c1c; --muted:#1c1c1cad; --faint:#1c1c1ca6;
    --primary:#1c1c1c; --primary-ink:#fcfcfc; --wash:#1c1c1c0f; --wash-2:#1c1c1c14;
    --accent:#126fd4; --accent-text:#0b69cc; --focus:#0b6dd3;
    --ok:#14804a; --warn:#b45309; --bad:#d6293b;
    --shadow:0 16px 40px -16px rgb(0 0 0 / .18), 0 4px 10px -4px rgb(0 0 0 / .06);
    color-scheme: light;
  }
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }
svg.i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--control); border-radius:10px; border:3px solid transparent; background-clip:content-box; }

.app { display:grid; grid-template-columns:260px minmax(0,1fr); height:100vh; }
aside { background:var(--sidebar); border-right:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
.brand { display:flex; align-items:center; gap:9px; padding:14px 10px 10px 14px; }
.brand svg { color:var(--ink); }
.brand b { font-size:14px; font-weight:600; flex:1; }
.icon-btn { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:var(--r-md); border:0; background:transparent; color:var(--muted); transition:background .12s, color .12s; }
.icon-btn:hover { background:var(--wash-2); color:var(--ink); }
.search { margin:0 10px 8px; position:relative; }
.search svg { position:absolute; left:10px; top:50%; translate:0 -50%; color:var(--faint); width:15px; height:15px; }
.search input { width:100%; height:32px; border-radius:var(--r-md); border:1px solid transparent; background:var(--wash); padding:0 10px 0 31px; font-size:13px; }
.search input:focus { outline:none; border-color:var(--line); }
.search input::placeholder { color:var(--faint); }
.list { flex:1; overflow:auto; padding:0 6px 8px; }
.list-label { font-size:12px; font-weight:500; color:var(--faint); padding:10px 8px 4px; }
.item { width:100%; display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:var(--r-md); border:0; background:transparent; text-align:left; transition:background .12s; }
.item:hover { background:var(--wash); }
.item[aria-current="page"] { background:var(--wash-2); }
.item .meta { min-width:0; flex:1; }
.item .t { display:flex; justify-content:space-between; gap:8px; font-weight:500; font-size:13.5px; }
.item .t span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .s { color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.avatar { position:relative; width:32px; height:32px; border-radius:var(--r-md); display:grid; place-items:center; font-weight:600; font-size:13px; flex:none; background:var(--control); color:var(--ink); }
.avatar .dot { position:absolute; right:-3px; bottom:-3px; width:10px; height:10px; border-radius:50%; border:2px solid var(--sidebar); background:var(--faint); }
.top .avatar .dot { border-color:var(--bg); }
.dot.running { background:var(--ok); } .dot.degraded, .dot.starting { background:var(--warn); } .dot.conflict, .dot.credential_invalid, .dot.error { background:var(--bad); }
.nav { padding:6px; border-top:1px solid var(--edge); display:grid; gap:1px; }
.nav button { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:var(--r-md); border:0; background:transparent; color:var(--muted); text-align:left; font-size:13.5px; }
.nav button:hover { background:var(--wash); color:var(--ink); }
.nav button[aria-current="page"] { background:var(--wash-2); color:var(--ink); }
.badge { margin-left:auto; min-width:18px; padding:0 6px; height:18px; border-radius:9px; background:var(--primary); color:var(--primary-ink); font-size:11px; font-weight:600; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.author { padding:8px 14px 12px; font-size:11.5px; color:var(--faint); }

main { min-width:0; overflow:auto; display:flex; flex-direction:column; }
.top { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; padding:10px 24px; background:var(--bg); border-bottom:1px solid var(--edge); min-height:52px; }
.top h1 { font-size:14px; font-weight:600; margin:0; }
.top .grow { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:999px; background:var(--wash); font-size:12px; color:var(--muted); white-space:nowrap; }
.pill .dot { width:7px; height:7px; border-radius:50%; border:0; position:static; }
.content { padding:20px 24px 48px; max-width:880px; width:100%; display:grid; gap:14px; }

.btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 13px; border-radius:999px; border:1px solid var(--line); background:var(--wash); font-size:13px; font-weight:500; white-space:nowrap; transition:background .12s, opacity .12s; }
.btn:hover { background:var(--wash-2); }
.btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
.btn.primary:hover { opacity:.88; }
.btn.danger { color:var(--bad); background:transparent; border-color:transparent; }
.btn.danger:hover { background:var(--wash); }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.ghost:hover { background:var(--wash); }
.btn[disabled] { opacity:.5; cursor:progress; }
.btn svg.i { width:15px; height:15px; }

.card { background:var(--card); border:1px solid var(--edge); border-radius:var(--r-lg); padding:16px 18px; }
.card h2 { margin:0 0 2px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.card .sub { margin:0 0 14px; color:var(--muted); font-size:13px; }
.grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
.grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.kv { display:grid; grid-template-columns:140px minmax(0,1fr); gap:6px 16px; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; overflow-wrap:anywhere; }
.mono { font-family:var(--mono); font-size:12.5px; }
.note { border-radius:var(--r-md); padding:10px 12px; font-size:13px; display:flex; gap:10px; align-items:flex-start; background:var(--wash); border:1px solid var(--edge); color:var(--ink); }
.note svg.i { margin-top:2px; }
.note.warn svg.i { color:var(--warn); }
.note.bad svg.i { color:var(--bad); } .note.bad { border-color:color-mix(in srgb, var(--bad) 40%, transparent); }
.note.ok svg.i { color:var(--ok); }

.hero { padding:4px 0 6px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; align-items:start; background:none; border:0; }
.hero h2 { font-size:20px; font-weight:600; line-height:1.3; margin:0 0 6px; letter-spacing:-.01em; }
.hero p { color:var(--muted); margin:0 0 16px; font-size:13.5px; max-width:48ch; }
.steps { display:grid; counter-reset:s; border:1px solid var(--edge); border-radius:var(--r-lg); background:var(--card); }
.step { display:flex; gap:12px; padding:11px 14px; border-top:1px solid var(--edge); }
.step:first-child { border-top:0; }
.step::before { counter-increment:s; content:counter(s); width:20px; height:20px; border-radius:50%; border:1px solid var(--line); color:var(--muted); display:grid; place-items:center; font-size:11.5px; font-weight:500; flex:none; margin-top:1px; font-variant-numeric:tabular-nums; }
.step b { display:block; font-size:13px; font-weight:500; } .step span { color:var(--muted); font-size:12.5px; }
.stat { padding:14px 16px; }
.stat .n { font-size:22px; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums; }
.stat .l { color:var(--muted); font-size:12.5px; margin-top:2px; }

.seg { display:grid; gap:6px; }
.seg label { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--edge); border-radius:var(--r-md); cursor:pointer; transition:border-color .12s, background .12s; }
.seg label:hover { background:var(--wash); }
.seg input { margin:2px 0 0; accent-color:var(--ink); width:15px; height:15px; }
.seg label:has(input:checked) { border-color:var(--line); background:var(--wash-2); }
.seg b { display:block; font-size:13px; font-weight:500; } .seg label > span { flex:1; } .seg span span { display:block; color:var(--muted); font-size:12.5px; }
.choice { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.choice label { position:relative; display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:10px 12px; border:1px solid var(--edge); border-radius:var(--r-md); cursor:pointer; transition:border-color .12s, background .12s; }
.choice label:hover { background:var(--wash); }
.choice label:has(input:checked) { border-color:var(--ink); background:var(--wash-2); }
.choice input { position:absolute; opacity:0; }
.choice label:has(input:focus-visible) { outline:2px solid var(--focus); outline-offset:2px; }
.choice .avatar { width:28px; height:28px; }
.choice b { font-size:13px; font-weight:500; }
.choice .help { line-height:1.35; }

.field { display:grid; gap:5px; margin-bottom:12px; }
.field > span { font-size:12.5px; font-weight:500; color:var(--muted); }
.field input:not([type=radio]):not([type=checkbox]), .field select { height:34px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--bg); padding:0 10px; width:100%; font-size:13px; }
.field input:focus, .field select:focus { border-color:var(--focus); outline:none; }
.help { font-size:12px; color:var(--faint); }
.form-error { color:var(--bad); font-size:13px; min-height:18px; margin:2px 0 0; }

.people { display:grid; gap:1px; }
.person { display:flex; align-items:center; gap:10px; padding:8px 4px; border-top:1px solid var(--edge); font-size:13px; }
.person:first-child { border-top:0; }
.person .role { font-size:11.5px; padding:1px 7px; border-radius:999px; background:var(--wash-2); color:var(--muted); }
.person .grow { flex:1; }
.code { font:600 20px/1 var(--mono); letter-spacing:.12em; padding:10px 14px; background:var(--wash); border:1px solid var(--edge); border-radius:var(--r-md); display:inline-flex; gap:12px; align-items:center; }

.log { display:grid; }
.log .e { display:grid; grid-template-columns:110px 120px minmax(0,1fr); gap:12px; padding:7px 0; border-top:1px solid var(--edge); font-size:13px; }
.log .e:first-child { border-top:0; }
.log time { color:var(--faint); font-variant-numeric:tabular-nums; }
.log .who { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.empty { color:var(--muted); font-size:13px; padding:4px 0; }

dialog { width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 48px); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card); color:var(--ink); padding:0; box-shadow:var(--shadow); }
dialog::backdrop { background:rgb(0 0 0 / .5); }
dialog header { display:flex; align-items:center; justify-content:space-between; padding:14px 14px 4px 18px; }
dialog header h2 { margin:0; font-size:15px; font-weight:600; }
dialog form { padding:8px 18px 16px; overflow:auto; }
dialog .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

.toast { position:fixed; right:16px; bottom:16px; z-index:20; max-width:400px; padding:10px 14px; border-radius:var(--r-md); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); font-size:13px; opacity:0; translate:0 6px; transition:opacity .16s, translate .16s; pointer-events:none; }
.toast.show { opacity:1; translate:0 0; }
.toast.bad { border-color:var(--bad); }

@media (max-width: 860px) {
  .app { grid-template-columns:1fr; height:auto; min-height:100vh; }
  aside { border-right:0; border-bottom:1px solid var(--edge); }
  .list { max-height:240px; }
  .hero, .grid2, .grid3, .choice { grid-template-columns:1fr; }
  .top, .content { padding-left:16px; padding-right:16px; }
  .log .e { grid-template-columns:1fr; gap:2px; }
  .kv { grid-template-columns:1fr; gap:2px; } .kv dd { margin-bottom:8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>

<div class="app">
  <aside aria-label="Danh sách bot">
    <div class="brand">
      <svg width="24" height="24" aria-hidden="true"><use href="#logo"/></svg>
      <b>Limix Bot</b>
      <button class="icon-btn" id="addBtn" aria-label="Thêm bot" title="Thêm bot"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr" for="q">Tìm bot</label>
      <input id="q" type="search" placeholder="Tìm bot" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
    <nav class="nav" aria-label="Điều hướng">
      <button data-go="home"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg>Tổng quan</button>
      <button data-go="pairing"><svg class="i" aria-hidden="true"><use href="#i-inbox"/></svg>Chờ duyệt<span class="badge" id="pendingBadge" hidden></span></button>
      <button data-go="activity"><svg class="i" aria-hidden="true"><use href="#i-pulse"/></svg>Nhật ký</button>
      <button data-go="settings"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg>Cài đặt</button>
    </nav>
    <div class="author">Leox ৹ Limix AI</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="addDialog" aria-labelledby="addTitle">
  <header><h2 id="addTitle">Kết nối bot mới</h2><button class="icon-btn" type="button" data-close aria-label="Đóng"><svg class="i"><use href="#i-x"/></svg></button></header>
  <form id="addForm" novalidate>
    <div class="field"><span>Nền tảng</span>
      <div class="choice" role="radiogroup" aria-label="Nền tảng">
        <label><input type="radio" name="platform" value="telegram" checked><span class="avatar telegram"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></span><span style="display:grid;gap:2px"><b>Telegram</b><span class="help">Token từ @BotFather</span></span></label>
        <label><input type="radio" name="platform" value="zalo"><span class="avatar zalo"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg></span><span style="display:grid;gap:2px"><b>Zalo</b><span class="help">Token từ bot.zaloplatforms.com</span></span></label>
        <label><input type="radio" name="platform" value="discord"><span class="avatar discord"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg></span><span style="display:grid;gap:2px"><b>Discord</b><span class="help">Token từ Developer Portal</span></span></label>
      </div>
    </div>
    <label class="field"><span>Token của bot</span><input name="token" type="password" autocomplete="off" required placeholder="Dán token vào đây"><span class="help" id="tokenHelp">Telegram: nhắn @BotFather → /newbot → copy token.</span></label>
    <label class="field"><span>Tên hiển thị (không bắt buộc)</span><input name="name" maxlength="60" placeholder="Ví dụ: Trợ lý bán hàng"></label>
    <div class="field"><span>Bộ não AI</span>
      <div class="seg">
        <label><input type="radio" name="engineKind" value="openmausbot" checked><span><b>Bot trong Limix Bot</b><span>Câu trả lời do bot AI trong Limix Bot viết.</span></span></label>
        <label><input type="radio" name="engineKind" value="echo"><span><b>Chế độ thử</b><span>Bot nhắc lại tin bạn gửi, để kiểm tra kết nối.</span></span></label>
      </div>
    </div>
    <div id="ombFields">
      <label class="field"><span>Bot AI trong Limix Bot</span><select name="appBot" data-appbot></select><span class="help">Chọn bot: Limix Bot tự bật Bot API, lấy địa chỉ và khóa. Không cần chép tay.</span></label>
      <div class="manual">
      <label class="field"><span>Địa chỉ Bot API</span><input name="endpoint" class="mono" autocomplete="off" placeholder="http://127.0.0.1:…/hooks/api/bots/…/messages"></label>
      <label class="field"><span>Khóa Bot API</span><input name="apiKey" type="password" autocomplete="off" placeholder="bak_…"><span class="help">Limix Bot: mở bot → bánh răng → Advanced: Access → Bot API → bật “Let apps talk to this bot”, copy địa chỉ và khóa.</span></label>
      </div>
    </div>
    <label class="field"><span>Ai được nhắn cho bot</span>
      <select name="accessPolicy">
        <option value="pairing">Người lạ xin mã, bạn duyệt (khuyên dùng)</option>
        <option value="owner_only">Chỉ mình tôi</option>
        <option value="open">Mọi người</option>
      </select>
    </label>
    <p class="form-error" id="addError" role="alert"></p>
    <div class="actions"><button class="btn ghost" type="button" data-close>Hủy</button><button class="btn primary" type="submit"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg>Kết nối</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const ADMIN = "__ADMIN_TOKEN__";
const APP = { version: "0.2.0", author: "Leox ৹ Limix AI" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const icon = (n, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const STATUS = { running:"Đang chạy", stopped:"Đã dừng", starting:"Đang khởi động", degraded:"Mất kết nối, đang thử lại", conflict:"Xung đột", credential_invalid:"Token sai", error:"Lỗi" };
const POLICY = {
  pairing: ["Người lạ xin mã, bạn duyệt", "Ai nhắn lần đầu sẽ nhận mã 8 ký tự; bạn duyệt trong mục Chờ duyệt."],
  owner_only: ["Chỉ chủ bot", "Chỉ người đã liên kết bằng /link mới dùng được bot."],
  open: ["Mọi người", "Ai cũng nhắn được và dùng chung hạn mức AI của bạn."],
};
const GROUP = {
  mention: ["Khi được gọi tên", "Trả lời khi có người gõ @tên bot trong tin nhắn (khuyên dùng)."],
  all: ["Mọi tin nhắn", "Trả lời mọi tin trong nhóm. Dễ bị ồn và tốn lượt AI."],
  off: ["Không trả lời trong nhóm", "Bot chỉ trả lời khi nhắn riêng."],
};
const PLATFORM = { telegram:"Telegram", zalo:"Zalo", discord:"Discord" };
let APP_BOTS = { inside: false, bots: [] };
function appBotOptions() {
  if (!APP_BOTS.inside) return `<option value="">Nhập tay địa chỉ và khóa</option>`;
  return APP_BOTS.bots.map((b) => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("") + `<option value="">Nhập tay địa chỉ và khóa…</option>`;
}
async function loadAppBots() {
  try { APP_BOTS = await api("/api/app/bots"); } catch { APP_BOTS = { inside: false, bots: [] }; }
  document.querySelectorAll("select[data-appbot]").forEach((sel) => { const v = sel.value; sel.innerHTML = appBotOptions(); if (v) sel.value = v; syncManual(sel.form); });
}
function syncManual(f) {
  const manual = f?.querySelector(".manual"); const sel = f?.querySelector("select[data-appbot]");
  if (manual && sel) manual.hidden = Boolean(sel.value);
}
/** A picked bot: the app switches its Bot API on and hands back the address and a key. */
async function fillFromApp(f) {
  const botId = f.appBot?.value; if (!botId) return null;
  const link = await api("/api/app/link", { botId });
  f.endpoint.value = link.endpoint; f.apiKey.value = link.apiKey;
  return link;
}
let S = { connections: [], pairing: [], activity: [] };
let view = { name: "home" };
let lastMain = "";

function prefTheme() { try { return localStorage.getItem("limix.theme") || "system"; } catch { return "system"; } }
function applyTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("limix.theme", t); } catch {}
}
applyTheme(prefTheme());

// Served at "/" by itself, or under a prefix by the Limix Bot server (/api/limix/gateway/): calls keep that prefix.
const BASE = location.pathname.replace(/\/+$/, "");
async function api(path, body) {
  const res = await fetch(BASE + path, { method: body === undefined ? "GET" : "POST", headers: { "X-Limix-Admin": ADMIN, "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
  return data;
}
let toastTimer;
function toast(text, bad) {
  const t = $("#toast"); t.textContent = text; t.className = `toast show${bad ? " bad" : ""}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", 3800);
}
const fmtTime = (ms) => new Date(ms).toLocaleString("vi-VN", { hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit" });
const initial = (c) => (c.name || "?").trim().charAt(0).toUpperCase();
const conn = (id) => S.connections.find((c) => c.id === id);
const lastActivity = (id) => S.activity.find((a) => a.connectionId === id);

function avatar(c, size) {
  const st = size ? `style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px"` : "";
  return `<span class="avatar ${c.platform}" ${st} aria-hidden="true">${esc(initial(c))}</span>`;
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const items = S.connections.filter((c) => !q || c.name.toLowerCase().includes(q) || (c.botIdentity?.username || "").toLowerCase().includes(q));
  $("#list").innerHTML = `<div class="list-label">Bot của bạn</div>` + (items.length ? items.map((c) => {
    const last = lastActivity(c.id);
    return `<button class="item" data-bot="${c.id}" ${view.name === "bot" && view.id === c.id ? 'aria-current="page"' : ""}>
      ${avatar(c)}
      <span class="meta"><span class="t"><span>${esc(c.name)}</span><span class="help">${last ? esc(fmtTime(last.at).split(" ")[0]) : ""}</span></span>
      <span class="s">${esc(PLATFORM[c.platform])}${c.status === "running" ? "" : ` · ${esc(STATUS[c.status] || c.status)}`}</span></span>
    </button>`;
  }).join("") : `<div class="empty" style="padding:6px 10px">${q ? "Không tìm thấy bot." : "Chưa có bot nào."}</div>`);
  const n = S.pairing.length; const b = $("#pendingBadge"); b.hidden = !n; b.textContent = n;
  document.querySelectorAll(".nav button").forEach((btn) => {
    if (btn.dataset.go === view.name) btn.setAttribute("aria-current", "page"); else btn.removeAttribute("aria-current");
  });
}

function pageTop(title, extra = "") { return `<div class="top"><h1>${title}</h1><span class="grow"></span>${extra}</div>`; }

function homeView() {
  const running = S.connections.filter((c) => c.status === "running").length;
  const problems = S.connections.filter((c) => ["conflict", "credential_invalid", "error", "degraded"].includes(c.status)).length;
  const dayAgo = Date.now() - 86400000;
  const events = S.activity.filter((a) => a.at > dayAgo).length;
  const hero = `<section class="card hero">
    <div><h2>Bot AI của bạn, có mặt trên Telegram, Zalo và Discord.</h2>
      <p>Kết nối bot với bộ não AI trong Limix Bot. Limix nhận tin, kiểm soát ai được nhắn và gửi câu trả lời về đúng người.</p>
      <div class="row"><button class="btn primary" data-act="add">${icon("plus")}Kết nối bot ${S.connections.length ? "mới" : "đầu tiên"}</button></div></div>
    <div class="steps">
      <div class="step"><div><b>Tạo bot trên nền tảng</b><span>@BotFather (Telegram), bot.zaloplatforms.com (Zalo) hoặc discord.com/developers</span></div></div>
      <div class="step"><div><b>Bật Bot API trong Limix Bot</b><span>Copy địa chỉ và khóa của bot AI</span></div></div>
      <div class="step"><div><b>Kết nối và xác nhận chủ bot</b><span>Gửi /link MÃ từ điện thoại</span></div></div>
    </div></section>`;
  const stats = S.connections.length ? `<div class="grid3">
    <div class="card stat"><div class="n">${running}<span class="help" style="font-size:14px"> / ${S.connections.length}</span></div><div class="l">Bot đang chạy</div></div>
    <div class="card stat"><div class="n">${S.pairing.length}</div><div class="l">Yêu cầu chờ duyệt</div></div>
    <div class="card stat"><div class="n" style="color:${problems ? "var(--bad)" : "inherit"}">${problems}</div><div class="l">Bot cần chú ý · ${events} sự kiện trong 24 giờ</div></div>
  </div>` : "";
  return pageTop("Tổng quan") + `<div class="content">${hero}${stats}${S.connections.length ? logCard(S.activity.slice(0, 8), "Hoạt động gần đây") : ""}</div>`;
}

function logCard(rows, title, showBot = true) {
  return `<section class="card"><h2>${icon("pulse")}${title}</h2><p class="sub">Mọi token và khóa đã được che trước khi ghi.</p>
    <div class="log">${rows.length ? rows.map((a) => `<div class="e"><time>${esc(fmtTime(a.at))}</time><span class="who">${showBot ? esc(conn(a.connectionId)?.name || "") : esc(a.kind)}</span><span>${esc(a.text)}</span></div>`).join("") : `<div class="empty">Chưa có hoạt động.</div>`}</div></section>`;
}

function botView(c) {
  if (!c) return pageTop("Không tìm thấy") + `<div class="content"><div class="card">Bot này không còn.</div></div>`;
  const who = c.botIdentity?.username ? "@" + c.botIdentity.username : c.botIdentity?.id;
  const bad = ["conflict", "credential_invalid", "error"].includes(c.status);
  const actions = `${c.running ? `<button class="btn" data-act="stop" data-id="${c.id}">${icon("pause")}Dừng</button>` : `<button class="btn primary" data-act="start" data-id="${c.id}">${icon("play")}Chạy</button>`}`;
  const people = [...c.ownerIds.map((id) => [id, "Chủ bot"]), ...c.allowedIds.map((id) => [id, "Đã duyệt"])];
  return `<div class="top">${avatar(c, 36)}<div><h1>${esc(c.name)}</h1><div class="help">${esc(PLATFORM[c.platform])} · ${esc(who)}${c.status === "running" ? "" : ` · ${esc(STATUS[c.status] || c.status)}`}</div></div><span class="grow"></span>${actions}</div>
  <div class="content">
    ${c.statusDetail ? `<div class="note ${bad ? "bad" : "warn"}">${icon("alert")}<span>${esc(c.statusDetail)}</span></div>` : ""}
    ${c.ownerIds.length ? "" : `<div class="note warn">${icon("shield")}<span>Bot chưa có chủ. Tạo mã liên kết bên dưới rồi gửi từ điện thoại để xác nhận bạn là chủ bot.</span></div>`}
    <div class="grid2">
      <section class="card"><h2>${icon("link")}Liên kết chủ bot</h2><p class="sub">Mở bot trên điện thoại và gửi mã. Mã dùng một lần, hết hạn sau 15 phút.</p>
        <div id="codeBox"></div>
        <button class="btn" data-act="link-code" data-id="${c.id}">${icon("plus")}Tạo mã liên kết</button></section>
      <section class="card"><h2>${icon("cpu")}Bộ não AI</h2><p class="sub">${c.engine.kind === "echo" ? "Đang ở chế độ thử: bot nhắc lại tin nhắn." : "Bot AI trong Limix Bot trả lời qua Bot API."}</p>
        <dl class="kv"><dt>Loại</dt><dd>${c.engine.kind === "echo" ? "Chế độ thử" : "Limix Bot"}</dd>
        ${c.engine.kind === "openmausbot" ? `<dt>Địa chỉ</dt><dd class="mono">${esc(c.engine.endpoint)}</dd><dt>Khóa</dt><dd class="mono">${esc(c.engine.keyMasked)}</dd>` : ""}
        <dt>Token bot</dt><dd class="mono">${esc(c.tokenMasked)}</dd></dl>
        <details style="margin-top:14px"><summary class="btn ghost" style="display:inline-flex">Đổi bộ não AI</summary>
          <form class="engineForm" data-id="${c.id}" style="margin-top:12px">
            <label class="field"><span>Bot AI trong Limix Bot</span><select name="appBot" data-appbot>${appBotOptions()}</select><span class="help">Chọn bot: tự lấy địa chỉ và khóa mới. Khóa cũ của bot đó sẽ thôi dùng được.</span></label>
            <div class="manual">
            <label class="field"><span>Địa chỉ Bot API</span><input name="endpoint" class="mono" autocomplete="off"></label>
            <label class="field"><span>Khóa Bot API</span><input name="apiKey" type="password" autocomplete="off"></label>
            </div>
            <button class="btn primary" type="submit">${icon("check")}Lưu</button></form></details></section>
    </div>
    <section class="card"><h2>${icon("users")}Trong nhóm chat</h2><p class="sub">Khi bạn thêm bot vào một nhóm Zalo, Telegram hoặc kênh Discord. Bot chỉ trả lời người đã được phép nhắn cho bot.</p>
      <div class="seg" role="radiogroup" aria-label="Trong nhóm chat">${Object.entries(GROUP).map(([k, [t, d]]) => `<label><input type="radio" name="group-${c.id}" value="${k}" data-group="${c.id}" ${k === (c.groupMode || "mention") ? "checked" : ""}><span><b>${t}</b><span>${d}</span></span></label>`).join("")}</div></section>
    <section class="card"><h2>${icon("shield")}Ai được nhắn cho bot</h2><p class="sub">Áp dụng ngay, không cần chạy lại.</p>
      <div class="seg" role="radiogroup" aria-label="Quyền truy cập">${Object.entries(POLICY).map(([k, [t, d]]) => `<label><input type="radio" name="policy-${c.id}" value="${k}" data-policy="${c.id}" ${k === c.accessPolicy ? "checked" : ""}><span><b>${t}</b><span>${d}</span></span></label>`).join("")}</div></section>
    <section class="card"><h2>${icon("users")}Người dùng có quyền</h2><p class="sub">Gỡ quyền thì người đó phải xin mã lại.</p>
      <div class="people">${people.length ? people.map(([id, r]) => `<div class="person"><span class="mono grow">${esc(id)}</span><span class="role">${r}</span><button class="btn danger" style="height:30px" data-act="remove-person" data-id="${c.id}" data-person="${esc(id)}" aria-label="Gỡ quyền ${esc(id)}">${icon("x")}Gỡ</button></div>`).join("") : `<div class="empty">Chưa có ai.</div>`}</div></section>
    ${logCard(S.activity.filter((a) => a.connectionId === c.id).slice(0, 12), "Hoạt động của bot", false)}
    <section class="card"><h2>${icon("trash")}Ngắt kết nối</h2><p class="sub">Xóa bot khỏi Limix kèm token đã lưu. Bot trên ${esc(PLATFORM[c.platform])} vẫn còn.</p>
      <button class="btn danger" data-act="delete" data-id="${c.id}">${icon("trash")}Ngắt kết nối bot này</button></section>
  </div>`;
}

function pairingView() {
  return pageTop("Chờ duyệt") + `<div class="content"><section class="card"><h2>${icon("inbox")}Yêu cầu dùng bot</h2>
    <p class="sub">Người lạ nhắn cho bot sẽ nhận mã và xuất hiện ở đây. Yêu cầu tự hết hạn sau 1 giờ.</p>
    <div class="people">${S.pairing.length ? S.pairing.map((p) => `<div class="person"><span class="grow"><b>${esc(p.senderName || p.senderId)}</b><span class="help">ID ${esc(p.senderId)} · ${esc(conn(p.connectionId)?.name || "")} · ${esc(fmtTime(p.createdAt))}</span></span>
      <button class="btn primary" data-act="approve" data-id="${p.id}">${icon("check")}Duyệt</button><button class="btn ghost" data-act="deny" data-id="${p.id}">Từ chối</button></div>`).join("") : `<div class="empty">Không có yêu cầu nào.</div>`}</div></section></div>`;
}

function activityView() { return pageTop("Nhật ký") + `<div class="content">${logCard(S.activity, "Toàn bộ hoạt động")}</div>`; }

function settingsView() {
  const t = prefTheme();
  return pageTop("Cài đặt") + `<div class="content">
    <section class="card"><h2>Giao diện</h2><p class="sub">Chọn màu nền cho ứng dụng.</p>
      <div class="seg" role="radiogroup" aria-label="Giao diện">${[["system", "Theo Windows"], ["dark", "Tối"], ["light", "Sáng"]].map(([k, l]) => `<label><input type="radio" name="theme" value="${k}" data-theme-pick ${k === t ? "checked" : ""}><span><b>${l}</b></span></label>`).join("")}</div></section>
    <section class="card"><h2>Giới thiệu</h2>
      <dl class="kv"><dt>Ứng dụng</dt><dd>Limix Bot ${APP.version}</dd><dt>Tác giả</dt><dd>${esc(APP.author)}</dd>
      <dt>Dữ liệu</dt><dd>Thư mục <span class="mono">limix-gateway\\data</span> (token đã mã hóa, đừng chia sẻ)</dd>
      <dt>Nền tảng AI</dt><dd>Limix Bot qua Bot API</dd></dl></section>
    <section class="card"><h2>${icon("power")}Thoát Limix</h2><p class="sub">Dừng mọi bot. Bot sẽ không trả lời cho tới khi mở lại Limix Bot.</p>
      <button class="btn danger" data-act="shutdown">${icon("power")}Thoát</button></section>
  </div>`;
}

function renderMain(force) {
  const html = view.name === "bot" ? botView(conn(view.id)) : view.name === "pairing" ? pairingView() : view.name === "activity" ? activityView() : view.name === "settings" ? settingsView() : homeView();
  const main = $("#main");
  const busy = main.contains(document.activeElement) && document.activeElement.matches("input, select, textarea, summary") || main.querySelector("details[open]");
  if (!force && (html === lastMain || busy)) return;
  lastMain = html; main.innerHTML = html;
}

function go(name, id) { view = { name, id }; renderList(); renderMain(true); $("#main").scrollTop = 0; $("#main").focus({ preventScroll: true }); }

async function copyText(text) {
  if (typeof text !== "string" || !text.trim()) return false;
  let timer;
  try {
    if (navigator.clipboard?.writeText && await Promise.race([
      navigator.clipboard.writeText(text).then(() => true),
      new Promise((resolve) => { timer = setTimeout(() => resolve(false), 3000); }),
    ])) return true;
  } catch {
  } finally {
    clearTimeout(timer);
  }
  const active = document.activeElement;
  const selection = window.getSelection();
  const ranges = selection ? Array.from({ length: selection.rangeCount }, (_, index) => selection.getRangeAt(index).cloneRange()) : [];
  const area = document.createElement("textarea");
  area.value = text;
  area.readOnly = true;
  area.style.cssText = "position:fixed;left:-9999px;top:0";
  try {
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, text.length);
    return document.execCommand?.("copy") === true;
  } catch {
    return false;
  } finally {
    area.remove();
    active?.focus?.({ preventScroll: true });
    if (selection) {
      selection.removeAllRanges();
      for (const range of ranges) selection.addRange(range);
    }
  }
}

async function refresh(force) {
  try { S = await api("/api/state"); renderList(); renderMain(force); }
  catch (e) { toast(e.message, true); }
}

document.addEventListener("click", async (ev) => {
  const nav = ev.target.closest("[data-go]"); if (nav) return go(nav.dataset.go);
  const item = ev.target.closest("[data-bot]"); if (item) return go("bot", item.dataset.bot);
  if (ev.target.closest("#addBtn")) return openAdd();
  if (ev.target.closest("[data-close]")) return $("#addDialog").close();
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const { act, id } = b.dataset;
  try {
    if (act === "add") return openAdd();
    if (act === "delete") { if (!confirm("Ngắt kết nối bot này khỏi Limix? Bot trên nền tảng vẫn còn.")) return; await api(`/api/connections/${id}/delete`, {}); toast("Đã ngắt kết nối."); return go("home"); }
    if (act === "shutdown") { if (!confirm("Thoát Limix? Mọi bot sẽ ngừng trả lời.")) return; await api("/api/shutdown", {}); document.body.innerHTML = `<div style="display:grid;place-items:center;height:100vh;color:var(--muted)">Limix đã dừng. Bạn có thể đóng cửa sổ này.</div>`; return; }
    b.disabled = true;
    if (act === "approve" || act === "deny") { await api(`/api/pairing/${id}/${act}`, {}); toast(act === "approve" ? "Đã duyệt." : "Đã từ chối."); }
    else if (act === "remove-person") { await api(`/api/connections/${id}/remove-person`, { personId: b.dataset.person }); toast("Đã gỡ quyền."); }
    else if (act === "link-code") {
      const r = await api(`/api/connections/${id}/link-code`, {});
      const box = $("#codeBox");
      box.innerHTML = `<div class="code" style="margin-bottom:12px"><span>/link ${esc(r.code)}</span><button class="icon-btn" data-act="copy" data-text="/link ${esc(r.code)}" aria-label="Sao chép">${icon("copy")}</button></div>`;
      b.disabled = false; return;
    }
    else if (act === "copy") {
      if (await copyText(b.dataset.text)) toast("Đã sao chép.");
      else {
        const code = b.closest(".code")?.querySelector("span");
        if (code) {
          const range = document.createRange();
          range.selectNodeContents(code);
          const selection = window.getSelection();
          selection?.removeAllRanges();
          selection?.addRange(range);
        }
        toast("Không thể sao chép tự động. Hãy chọn và sao chép mã trực tiếp.", true);
      }
      return;
    }
    else await api(`/api/connections/${id}/${act}`, {});
    await refresh(true);
  } catch (e) { toast(e.message, true); }
  finally { b.disabled = false; }
});

document.addEventListener("change", async (ev) => {
  const p = ev.target.closest("[data-policy]");
  if (p) { try { await api(`/api/connections/${p.dataset.policy}/policy`, { accessPolicy: p.value }); toast("Đã cập nhật quyền."); p.blur(); await refresh(true); } catch (e) { toast(e.message, true); } }
  const g = ev.target.closest("[data-group]");
  if (g) { try { await api(`/api/connections/${g.dataset.group}/group`, { groupMode: g.value }); toast("Đã cập nhật cách trả lời trong nhóm."); g.blur(); await refresh(true); } catch (e) { toast(e.message, true); } }
  const t = ev.target.closest("[data-theme-pick]"); if (t) { applyTheme(t.value); }
});

document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest(".engineForm"); if (!f) return;
  ev.preventDefault();
  try {
    await fillFromApp(f);
    if (!f.endpoint.value.trim() || !f.apiKey.value.trim()) throw new Error("Chọn một bot hoặc nhập địa chỉ và khóa Bot API.");
    await api(`/api/connections/${f.dataset.id}/engine`, { engineKind: "openmausbot", endpoint: f.endpoint.value.trim(), apiKey: f.apiKey.value.trim() });
    toast("Đã đổi bộ não AI."); document.activeElement.blur(); await refresh(true);
  }
  catch (e) { toast(e.message, true); }
});

$("#q").addEventListener("input", renderList);

const dlg = $("#addDialog"), form = $("#addForm");
function syncForm() {
  syncManual(form);
  $("#ombFields").hidden = form.engineKind.value !== "openmausbot";
  $("#tokenHelp").textContent = form.platform.value === "discord" ? "Discord: discord.com/developers → New Application → Bot → Reset Token → copy; bật Message Content Intent." : form.platform.value === "zalo" ? "Zalo: đăng nhập bot.zaloplatforms.com → tạo bot → copy token." : "Telegram: nhắn @BotFather → /newbot → copy token.";
}
function openAdd() { form.reset(); $("#addError").textContent = ""; void loadAppBots(); syncForm(); dlg.showModal(); form.token.focus(); }
form.addEventListener("change", syncForm);
document.addEventListener("change", (ev) => { if (ev.target.matches?.("select[data-appbot]")) syncManual(ev.target.form); });
document.addEventListener("toggle", (ev) => { if (ev.target.matches?.("details") && ev.target.open) void loadAppBots(); }, true);
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = $("#addError"); err.textContent = "";
  if (!form.token.value.trim()) { err.textContent = "Chưa nhập token của bot."; form.token.focus(); return; }
  if (form.engineKind.value === "openmausbot" && !form.appBot.value && (!form.endpoint.value.trim() || !form.apiKey.value.trim())) { err.textContent = "Chọn bot AI trong Limix Bot, hoặc nhập địa chỉ và khóa Bot API (hoặc chọn Chế độ thử)."; return; }
  const btn = form.querySelector("[type=submit]"); btn.disabled = true; btn.lastChild.textContent = "Đang kiểm tra…";
  try {
    if (form.engineKind.value === "openmausbot") await fillFromApp(form);
    const r = await api("/api/connections", Object.fromEntries(new FormData(form)));
    dlg.close();
    toast(r.engineCheck && !r.engineCheck.ok ? `Đã kết nối, nhưng AI báo: ${r.engineCheck.message}` : "Đã kết nối. Tạo mã liên kết để xác nhận bạn là chủ bot.", r.engineCheck && !r.engineCheck.ok);
    await refresh(true); go("bot", r.connection.id);
  } catch (e) { err.textContent = e.message; }
  finally { btn.disabled = false; btn.lastChild.textContent = "Kết nối"; }
});

refresh(true);
void loadAppBots();
setInterval(() => refresh(false), 4000);
</script>
</body>
</html>
